name: Feature request
description: Suggest a user problem or capability to address.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who experiences this problem, and in what context?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Describe a possible solution without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: How would we know this change helped?
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Add relevant research, sketches, or constraints.
    validations:
      required: false
